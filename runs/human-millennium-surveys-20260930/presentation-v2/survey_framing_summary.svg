  <g id="text_13">
   <text style="fill: #172638; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="52.272" y="38.016" transform="rotate(-0 52.272 38.016)">Results by question form</text>
  </g>
  <g id="text_14">
   <text style="fill: #536577; font: 12px 'DejaVu Sans'; text-anchor: start" x="52.272" y="64.944" transform="rotate(-0 52.272 64.944)">ESPAI 2023. Two question forms, two respondent subsets, one survey wave.</text>
  </g>
  <g id="text_15">
   <text style="fill: #536577; font: 9px 'DejaVu Sans'; text-anchor: end" x="893.376" y="772.992" transform="rotate(-0 893.376 772.992)">2</text>
  </g>
  <g id="text_16">
   <text style="fill: #172638; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="52.272" y="132.264" transform="rotate(-0 52.272 132.264)">Question form A | 121 complete response triples</text>
  </g>
  <g id="text_17">
   <text style="fill: #172638; font: 12px 'DejaVu Sans'; text-anchor: start" x="52.272" y="162.36" transform="rotate(-0 52.272 162.36)">At what year would the chance be 10%, 50%, or 90%?</text>
  </g>
  <g id="text_18">
   <text style="fill: #172638; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="52.272" y="379.368" transform="rotate(-0 52.272 379.368)">Question form B | 128 complete response triples</text>
  </g>
  <g id="text_19">
   <text style="fill: #172638; font: 12px 'DejaVu Sans'; text-anchor: start" x="52.272" y="409.464" transform="rotate(-0 52.272 409.464)">What is the chance by 2033, 2043, or 2073?</text>
  </g>
  <g id="text_20">
   <text style="fill: #172638; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="52.272" y="605.088" transform="rotate(-0 52.272 605.088)">The 50% year is 2042 for form A. Form B gives 20% by 2043.</text>
  </g>
  <g id="text_21">
   <text style="fill: #536577; font: 11px 'DejaVu Sans'; text-anchor: start" x="52.272" y="633.6" transform="rotate(-0 52.272 633.6)">These are analyst summaries for separate respondent subsets.</text>
  </g>
  <g id="text_22">
   <text style="fill: #536577; font: 11px 'DejaVu Sans'; text-anchor: start" x="52.272" y="658.152" transform="rotate(-0 52.272 658.152)">Each value is the median of one coordinate from complete, numeric, monotone triples.</text>
  </g>
  <g id="text_23">
   <text style="fill: #536577; font: 11px 'DejaVu Sans'; text-anchor: start" x="52.272" y="682.704" transform="rotate(-0 52.272 682.704)">The published pooled 50% year is about 2050. It uses a different method.</text>
  </g>
  <g id="text_24">
   <text style="fill: #536577; font: 11px 'DejaVu Sans'; text-anchor: start" x="52.272" y="707.256" transform="rotate(-0 52.272 707.256)">The difference does not measure a change in the same people over time.</text>
  </g>
  <g id="text_25">
   <text style="fill: #536577; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="52.272" y="750.816" transform="rotate(-0 52.272 750.816)">Source: saved public cleaned ESPAI 2023 responses. These summaries add no survey wave.</text>
  </g>
